<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>WearMonitor Icon</title>
  <desc>System Information and Performance Dashboard Icon for Wear OS</desc>
  <defs>
    <!-- Background Dial Radial Gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#161F33"/>
      <stop offset="60%" stop-color="#0C101A"/>
      <stop offset="100%" stop-color="#05070B"/>
    </radialGradient>

    <!-- Outer Rim Metallic Gradient -->
    <linearGradient id="rimGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3D59"/>
      <stop offset="50%" stop-color="#151C2A"/>
      <stop offset="100%" stop-color="#0A0E17"/>
    </linearGradient>

    <!-- Metric Gradients -->
    <!-- CPU: Electric Cyan to Vivid Blue -->
    <linearGradient id="cpuGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Battery: Emerald to Mint Green -->
    <linearGradient id="batGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#69F0AE"/>
    </linearGradient>

    <!-- Thermal / Storage: Amber to Fire Orange -->
    <linearGradient id="tempGradient" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9100"/>
      <stop offset="100%" stop-color="#FF3D00"/>
    </linearGradient>

    <!-- Central Chip Body Gradient -->
    <linearGradient id="chipGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C263D"/>
      <stop offset="100%" stop-color="#0F1524"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Pulse Glow Filter -->
    <filter id="pulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Watch Bezel Base -->
  <circle cx="256" cy="256" r="244" fill="url(#rimGradient)" stroke="#1F2B40" stroke-width="2"/>
  <circle cx="256" cy="256" r="236" fill="url(#bgGradient)"/>

  <!-- Radar / Telemetry Guide Rings -->
  <circle cx="256" cy="256" r="214" fill="none" stroke="#1E2C44" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.6"/>
  <circle cx="256" cy="256" r="146" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.12"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.08"/>

  <!-- Precision Dial Ticks -->
  <g stroke="#4A607F" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <!-- Cardinal Ticks -->
    <line x1="256" y1="24" x2="256" y2="34" stroke="#00E5FF" stroke-width="3.5" opacity="0.9"/>
    <line x1="256" y1="478" x2="256" y2="488" stroke="#FF9100" stroke-width="3" opacity="0.8"/>
    <line x1="24" y1="256" x2="34" y2="256" stroke="#00E5FF" stroke-width="3" opacity="0.8"/>
    <line x1="478" y1="256" x2="488" y2="256" stroke="#00E676" stroke-width="3" opacity="0.8"/>
    <!-- 30 deg ticks -->
    <line x1="372" y1="55" x2="367" y2="64"/>
    <line x1="457" y1="140" x2="448" y2="145"/>
    <line x1="457" y1="372" x2="448" y2="367"/>
    <line x1="372" y1="457" x2="367" y2="448"/>
    <line x1="140" y1="457" x2="145" y2="448"/>
    <line x1="55" y1="372" x2="64" y2="367"/>
    <line x1="55" y1="140" x2="64" y2="145"/>
    <line x1="140" y1="55" x2="145" y2="64"/>
  </g>

  <!-- Metric Arc 1: CPU (Upper-Left, Cyan) -->
  <!-- Background Track -->
  <path d="M 89.24 333.76 A 184 184 0 0 1 224.05 74.8"
        fill="none" stroke="#00E5FF" stroke-width="16" stroke-linecap="round" opacity="0.12"/>
  <!-- Active Arc (Load ~75%) -->
  <path d="M 80.8 280 A 184 184 0 0 1 224.05 74.8"
        fill="none" stroke="url(#cpuGradient)" stroke-width="16" stroke-linecap="round" filter="url(#pulseGlow)"/>

  <!-- Metric Arc 2: Battery (Upper-Right, Emerald Green) -->
  <!-- Background Track -->
  <path d="M 287.95 74.8 A 184 184 0 0 1 422.76 333.76"
        fill="none" stroke="#00E676" stroke-width="16" stroke-linecap="round" opacity="0.12"/>
  <!-- Active Arc (Battery ~85%) -->
  <path d="M 287.95 74.8 A 184 184 0 0 1 430.5 272"
        fill="none" stroke="url(#batGradient)" stroke-width="16" stroke-linecap="round" filter="url(#pulseGlow)"/>

  <!-- Metric Arc 3: Temperature / Storage (Bottom, Amber/Orange) -->
  <!-- Background Track -->
  <path d="M 386.11 386.11 A 184 184 0 0 1 125.89 386.11"
        fill="none" stroke="#FF9100" stroke-width="16" stroke-linecap="round" opacity="0.12"/>
  <!-- Active Arc (~60%) -->
  <path d="M 386.11 386.11 A 184 184 0 0 1 230 438"
        fill="none" stroke="url(#tempGradient)" stroke-width="16" stroke-linecap="round" filter="url(#pulseGlow)"/>

  <!-- Top 12 o'clock Marker Arrow -->
  <polygon points="256,50 262,62 256,58 250,62" fill="#00E5FF" filter="url(#pulseGlow)"/>

  <!-- Chip External Connection Pins (8 Pins) -->
  <g fill="#00E5FF" opacity="0.85">
    <!-- Top Pins -->
    <rect x="224" y="166" width="12" height="20" rx="4"/>
    <rect x="276" y="166" width="12" height="20" rx="4"/>
    <!-- Bottom Pins -->
    <rect x="224" y="326" width="12" height="20" rx="4"/>
    <rect x="276" y="326" width="12" height="20" rx="4"/>
    <!-- Left Pins -->
    <rect x="166" y="224" width="20" height="12" rx="4"/>
    <rect x="166" y="276" width="20" height="12" rx="4"/>
    <!-- Right Pins -->
    <rect x="326" y="224" width="20" height="12" rx="4"/>
    <rect x="326" y="276" width="20" height="12" rx="4"/>
  </g>

  <!-- Central Processor Chip Package -->
  <!-- Outer Glow Shadow -->
  <rect x="186" y="186" width="140" height="140" rx="24"
        fill="#000000" opacity="0.4" filter="url(#glow)"/>
  <!-- Main Chip Body -->
  <rect x="186" y="186" width="140" height="140" rx="24"
        fill="url(#chipGradient)" stroke="#00E5FF" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Inner Die Area -->
  <rect x="202" y="202" width="108" height="108" rx="16"
        fill="#070B14" stroke="#1A263D" stroke-width="1.5"/>

  <!-- Top Quad-Core Status Indicators inside Chip -->
  <g>
    <rect x="222" y="214" width="12" height="7" rx="2" fill="#00E5FF" opacity="0.9"/>
    <rect x="238" y="214" width="12" height="7" rx="2" fill="#00E5FF" opacity="0.9"/>
    <rect x="262" y="214" width="12" height="7" rx="2" fill="#00E676" opacity="0.9"/>
    <rect x="278" y="214" width="12" height="7" rx="2" fill="#00E676" opacity="0.9"/>
  </g>

  <!-- Real-Time Activity / Pulse Telemetry Waveform -->
  <g filter="url(#pulseGlow)">
    <path d="M 204 256 L 222 256 L 232 268 L 246 226 L 258 286 L 270 244 L 282 256 L 308 256"
          fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M 204 256 L 222 256 L 232 268 L 246 226 L 258 286 L 270 244 L 282 256 L 308 256"
        fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Peak Pulse Glowing Sensor Node -->
  <circle cx="246" cy="226" r="4" fill="#FFFFFF"/>
  <circle cx="246" cy="226" r="7" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.8"/>

  <!-- Bottom Frequency / Telemetry Dots -->
  <g opacity="0.85">
    <circle cx="236" cy="296" r="3" fill="#00E5FF"/>
    <circle cx="256" cy="296" r="3" fill="#00E676"/>
    <circle cx="276" cy="296" r="3" fill="#FF9100"/>
  </g>
</svg>
